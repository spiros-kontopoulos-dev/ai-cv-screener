services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      # Tests use this explicit path for the repository-root setup wrappers.
      # This avoids guessing the repository layout from /app/tests inside Docker.
      AI_CV_SCREENER_REPOSITORY_ROOT: /repository
    ports:
      - "8000:8000"
    volumes:
      # Mount application source for Uvicorn reload during development.
      - ./backend/app:/app/app

      # Mount tests and Pytest configuration so newly edited tests are
      # immediately visible without rebuilding the backend image.
      - ./backend/tests:/app/tests
      - ./backend/pytest.ini:/app/pytest.ini:ro

      # The backend setup implementations are copied into the Docker image,
      # but mounting them keeps script-help edits visible without rebuilding.
      - ./backend/setup.sh:/app/setup.sh:ro
      - ./backend/setup.ps1:/app/setup.ps1:ro

      # Expose the public repository-root setup wrappers at an explicit,
      # collision-free path for the cross-platform setup tests.
      - ./setup.sh:/repository/setup.sh:ro
      - ./setup.ps1:/repository/setup.ps1:ro

      # Keep generated profiles, portraits, HTML previews, and PDFs on the host.
      - ./data:/app/data

      # Keep downloaded embedding models and the local ChromaDB index on the
      # host so they survive container restarts.
      - ./storage:/app/storage
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
